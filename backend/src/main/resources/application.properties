spring.application.name=backend


server.port=${PORT:8080}

server.error.include-message=always

# Database: H2 file by default. To use PostgreSQL later, add its driver to pom.xml
# and set DB_URL / DB_USER / DB_PASSWORD as environment variables.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/cafedb}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Set to true only on your own machine: http://localhost:8080/h2-console
spring.h2.console.enabled=false
